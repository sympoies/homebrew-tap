name: Update Symphony Board Casks
run-name: Update Symphony Board casks ${{ github.event.client_payload.tag || inputs.version }}

on:
  repository_dispatch:
    types:
      - symphony-board-release
  workflow_dispatch:
    inputs:
      version:
        description: Symphony Board version to publish, with or without leading v
        required: true
        type: string
      source_repo:
        description: Source GitHub repository containing release artifacts
        required: false
        default: sympoies/symphony-board
        type: string

permissions:
  contents: write

concurrency:
  group: update-symphony-board-casks
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare cask update
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_repo: ${{ steps.meta.outputs.source_repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
            tag="${DISPATCH_TAG}"
            source_repo="${DISPATCH_SOURCE_REPO:-sympoies/symphony-board}"
          else
            version="${INPUT_VERSION}"
            tag=""
            source_repo="${INPUT_SOURCE_REPO:-sympoies/symphony-board}"
          fi

          version="${version#v}"
          tag="${tag:-v${version}}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: invalid Symphony Board version: ${version}" >&2
            exit 1
          fi
          if ! [[ "${source_repo}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "error: invalid source_repo: ${source_repo}" >&2
            exit 1
          fi

          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "source_repo=${source_repo}" >>"${GITHUB_OUTPUT}"

      - name: Update casks from release artifacts
        run: |
          python3 scripts/update-symphony-board-casks.py \
            --cask-dir Casks \
            --source-repo "${{ steps.meta.outputs.source_repo }}" \
            --version "${{ steps.meta.outputs.version }}"

      - name: Upload updated casks
        uses: actions/upload-artifact@v4
        with:
          name: symphony-board-casks
          path: Casks/*.rb
          if-no-files-found: error

  brew-test:
    name: Brew cask test
    needs:
      - prepare
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@75ea84e0c056f44fbc237368be867593cd459107

      - name: Download updated casks
        uses: actions/download-artifact@v4
        with:
          name: symphony-board-casks
          path: Casks

      - name: Validate casks
        run: |
          ruby -c Casks/symphony-board.rb
          ruby -c Casks/symphony-board-standalone.rb
          brew style Casks/symphony-board.rb Casks/symphony-board-standalone.rb

      - name: Link local tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/sympoies/homebrew-tap"
          rm -rf "${tap_dir}"
          mkdir -p "$(dirname "${tap_dir}")"
          ln -s "${GITHUB_WORKSPACE}" "${tap_dir}"

      - name: Trust tap
        run: brew trust sympoies/tap

      - name: Install casks
        run: |
          appdir="${RUNNER_TEMP}/Applications"
          mkdir -p "${appdir}"
          brew install --cask sympoies/tap/symphony-board --appdir "${appdir}"
          brew install --cask sympoies/tap/symphony-board-standalone --appdir "${appdir}"
          test -d "${appdir}/Symphony Board.app"
          test -d "${appdir}/Symphony Board Standalone.app"

  commit:
    name: Commit cask update
    needs:
      - prepare
      - brew-test
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download updated casks
        uses: actions/download-artifact@v4
        with:
          name: symphony-board-casks
          path: Casks

      - name: Commit cask update
        id: commit
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const branch = 'main';
            const version = process.env.VERSION;
            const paths = [
              'Casks/symphony-board.rb',
              'Casks/symphony-board-standalone.rb',
            ];

            const headRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });
            const headSha = headRef.data.object.sha;
            const baseCommit = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
            });
            const tree = [];

            for (const path of paths) {
              const newContent = fs.readFileSync(path);
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: branch,
                });
                if (Buffer.from(data.content, 'base64').equals(newContent)) {
                  core.info(`${path} already current for v${version}`);
                  continue;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              const blob = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: newContent.toString('base64'),
                encoding: 'base64',
              });
              tree.push({
                path,
                mode: '100644',
                type: 'blob',
                sha: blob.data.sha,
              });
            }

            if (tree.length === 0) {
              core.info(`casks already current for v${version} at ${headSha}`);
              core.setOutput('commit_sha', headSha);
              return;
            }

            const newTree = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: baseCommit.data.tree.sha,
              tree,
            });
            const commit = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: `chore(symphony-board): bump casks to v${version}`,
              tree: newTree.data.sha,
              parents: [headSha],
            });
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
              sha: commit.data.sha,
            });

            const commitSha = commit.data.sha;
            core.info(`Committed Symphony Board casks via Git tree API at ${commitSha}.`);
            core.setOutput('commit_sha', commitSha);

  tap-release:
    name: Create tap release
    needs:
      - prepare
      - commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_SHA: ${{ needs.commit.outputs.commit_sha }}
        with:
          script: |
            const tag = `symphony-board-casks-v${process.env.VERSION}`;
            const target = process.env.COMMIT_SHA;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Tag ${tag} already exists.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: target,
              });
              core.info(`Created tag ${tag} at ${target}.`);
            }

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Release already exists for ${tag}; skipping.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: target,
              name: tag,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            });
            core.info(`Created release for ${tag}.`);
