name: Update nils-alfred-cli Formula
run-name: Update nils-alfred-cli ${{ github.event.client_payload.tag || inputs.version }}

on:
  repository_dispatch:
    types:
      - nils-alfred-cli-release
  workflow_dispatch:
    inputs:
      version:
        description: nils-alfred-cli version to publish, with or without leading v
        required: true
        type: string
      source_repo:
        description: Source GitHub repository containing release artifacts
        required: false
        default: sympoies/nils-alfredworkflow
        type: string

permissions:
  contents: write

concurrency:
  group: update-nils-alfred-cli-formula
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare formula update
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_repo: ${{ steps.meta.outputs.source_repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
            tag="${DISPATCH_TAG}"
            source_repo="${DISPATCH_SOURCE_REPO:-sympoies/nils-alfredworkflow}"
          else
            version="${INPUT_VERSION}"
            tag=""
            source_repo="${INPUT_SOURCE_REPO:-sympoies/nils-alfredworkflow}"
          fi

          version="${version#v}"
          tag="${tag:-v${version}}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: invalid nils-alfred-cli version: ${version}" >&2
            exit 1
          fi
          if ! [[ "${source_repo}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "error: invalid source_repo: ${source_repo}" >&2
            exit 1
          fi

          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "source_repo=${source_repo}" >>"${GITHUB_OUTPUT}"

      - name: Update formula from release artifacts
        run: |
          python3 scripts/update-nils-alfred-cli-formula.py \
            --formula Formula/nils-alfred-cli.rb \
            --source-repo "${{ steps.meta.outputs.source_repo }}" \
            --version "${{ steps.meta.outputs.version }}"

      - name: Upload updated formula
        uses: actions/upload-artifact@v4
        with:
          name: nils-alfred-cli-formula
          path: Formula/nils-alfred-cli.rb
          if-no-files-found: error

  brew-test:
    name: Brew test (${{ matrix.runner_os }})
    needs:
      - prepare
    runs-on: ${{ matrix.runner_os }}
    strategy:
      fail-fast: false
      matrix:
        runner_os:
          - macos-latest
          - ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updated formula
        uses: actions/download-artifact@v4
        with:
          name: nils-alfred-cli-formula
          path: Formula

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@75ea84e0c056f44fbc237368be867593cd459107

      - name: Validate formula
        run: |
          ruby -c Formula/nils-alfred-cli.rb
          brew style Formula/nils-alfred-cli.rb

      - name: Link local tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/sympoies/homebrew-tap"
          rm -rf "${tap_dir}"
          mkdir -p "$(dirname "${tap_dir}")"
          ln -s "${GITHUB_WORKSPACE}" "${tap_dir}"

      - name: Trust tap
        run: brew trust sympoies/tap

      - name: Configure Linux Homebrew sandbox
        if: runner.os == 'Linux'
        run: echo "HOMEBREW_NO_SANDBOX_LINUX=1" >>"${GITHUB_ENV}"

      - name: Install formula
        run: brew install sympoies/tap/nils-alfred-cli

      - name: Test formula
        run: brew test sympoies/tap/nils-alfred-cli

  commit:
    name: Commit formula update
    needs:
      - prepare
      - brew-test
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download updated formula
        uses: actions/download-artifact@v4
        with:
          name: nils-alfred-cli-formula
          path: Formula

      - name: Commit formula update
        id: commit
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = 'Formula/nils-alfred-cli.rb';
            const branch = 'main';
            const version = process.env.VERSION;

            const newContent = fs.readFileSync(path);

            let currentSha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              currentSha = data.sha;
              if (Buffer.from(data.content, 'base64').equals(newContent)) {
                core.info(`formula already current for v${version}`);
                core.setOutput('commit_sha', data.sha);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data } = await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `chore(nils-alfred-cli): bump to v${version}`,
              content: newContent.toString('base64'),
              sha: currentSha,
              branch,
            });
            core.info(`Committed ${data.commit.sha} via Contents API (verified).`);
            core.setOutput('commit_sha', data.commit.sha);

  tap-release:
    name: Create tap release
    needs:
      - prepare
      - commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_SHA: ${{ needs.commit.outputs.commit_sha }}
        with:
          script: |
            const tag = `nils-alfred-cli-v${process.env.VERSION}`;
            const target = process.env.COMMIT_SHA;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Tag ${tag} already exists.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: target,
              });
              core.info(`Created tag ${tag} at ${target}.`);
            }

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Release already exists for ${tag}; skipping.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: target,
              name: tag,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            });
            core.info(`Created release for ${tag}.`);
